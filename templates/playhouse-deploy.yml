# Playhouse deploy gate: copy lint + asset compress + Lighthouse 100s.
# Copy into the project as .github/workflows/playhouse-deploy.yml
# Adjust build/start commands and PLAYHOUSE_SKILL_PATH for your layout.

name: Playhouse deploy gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # Also run after hosting preview deploys if you wire a repository_dispatch
  # or use a deploy-preview URL via PLAYHOUSE_URL below.

concurrency:
  group: playhouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Install Pillow (asset compress)
        run: pip install pillow

      - name: Install playhouse runner deps
        env:
          PLAYHOUSE_SKILL_PATH: ${{ vars.PLAYHOUSE_SKILL_PATH || '.development/BlacnovaSkills/playhouse-audit' }}
        run: |
          if [ -d "$PLAYHOUSE_SKILL_PATH/scripts" ]; then
            npm install --prefix "$PLAYHOUSE_SKILL_PATH/scripts"
          else
            echo "Playhouse scripts not found at $PLAYHOUSE_SKILL_PATH"
            echo "Set repository variable PLAYHOUSE_SKILL_PATH or vendor the skill under that path."
            exit 1
          fi

      - name: Build production bundle
        run: npm run build --if-present

      - name: Run playhouse gate
        env:
          PLAYHOUSE_SKILL_PATH: ${{ vars.PLAYHOUSE_SKILL_PATH || '.development/BlacnovaSkills/playhouse-audit' }}
          # Optional: set PLAYHOUSE_URL to a deploy preview instead of local dist
          PLAYHOUSE_URL: ${{ vars.PLAYHOUSE_URL || secrets.PLAYHOUSE_URL || '' }}
        run: |
          ARGS=(--cwd . --runs 3 --form both --max-emoji 0)
          if [ -n "$PLAYHOUSE_URL" ]; then
            ARGS+=(--url "$PLAYHOUSE_URL" --skip-compress)
          fi
          node "$PLAYHOUSE_SKILL_PATH/scripts/gate.mjs" "${ARGS[@]}"

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playhouse-audit
          path: .playhouse-audit/
          if-no-files-found: ignore
